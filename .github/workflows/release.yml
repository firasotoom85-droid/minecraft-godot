name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Godot 4.7.2 .NET editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/godot-4.7.2"
          mkdir -p "$root/editor" "$root/templates"
          curl -fsSL \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip \
            -o "$root/editor.zip"
          curl -fsSL \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz \
            -o "$root/templates.tpz"
          unzip -q "$root/editor.zip" -d "$root/editor"
          unzip -q "$root/templates.tpz" -d "$root/templates"
          bin="$root/editor/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64"
          test -x "$bin"
          chmod +x "$bin"
          destination="$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          mkdir -p "$destination"
          if [[ -d "$root/templates/templates" ]]; then
            cp -a "$root/templates/templates/." "$destination/"
          else
            cp -a "$root/templates/." "$destination/"
          fi
          test -n "$(find "$destination" -maxdepth 1 -type f -print -quit)"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"

      - name: Debug and Release builds (warnings are errors)
        run: |
          dotnet build -c Debug --nologo -warnaserror
          dotnet build minecraft.csproj -c Release --nologo -warnaserror

      - name: Headless regression suite
        run: |
          timeout 300 "$GODOT_BIN" --headless --path . res://tests/TestRunner.tscn

      - name: Import project resources
        run: |
          "$GODOT_BIN" --headless --editor --path . --import

      - name: Export Linux and Windows builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/linux dist/windows
          "$GODOT_BIN" --headless --path . --export-release "Linux/X11" "$PWD/dist/linux/minecraft.x86_64"
          "$GODOT_BIN" --headless --path . --export-release "Windows Desktop" "$PWD/dist/windows/minecraft.exe"
          test -s dist/linux/minecraft.x86_64
          test -s dist/windows/minecraft.exe
          test -s dist/linux/minecraft.pck
          test -s dist/windows/minecraft.pck

      - name: Add provenance and license notices
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          commit="$(git rev-parse HEAD)"
          godot_version="$("$GODOT_BIN" --headless --version | head -n 1)"
          sdk_version="$(dotnet --version)"
          for platform in linux windows; do
            cp LICENSE THIRD_PARTY_NOTICES.md "dist/$platform/"
            cat > "dist/$platform/BUILD_INFO.txt" <<EOF
          Tag: $tag
          Commit: $commit
          Godot: $godot_version
          .NET SDK: $sdk_version
          Platform: $platform x86_64
          EOF
          done
          cat > dist/README-INSTALL.txt <<'EOF'
          Extract the archive and run minecraft.x86_64 on Linux or minecraft.exe on Windows.
          The export uses the Godot .NET runtime bundled with the engine build; no separate .NET
          installation is required for players. Keep BUILD_INFO.txt and the license notices.
          EOF
          cp dist/README-INSTALL.txt dist/linux/
          cp dist/README-INSTALL.txt dist/windows/

      - name: Smoke-test Linux export and validate Windows archive
        shell: bash
        run: |
          set -euo pipefail
          timeout 60 dist/linux/minecraft.x86_64 --headless --quit-after 5
          (cd dist/windows && zip -qr ../minecraft-windows-x86_64.zip .)
          unzip -t dist/minecraft-windows-x86_64.zip
          unzip -Z1 dist/minecraft-windows-x86_64.zip | grep -Fx "minecraft.exe"
          unzip -Z1 dist/minecraft-windows-x86_64.zip | grep -Fx "minecraft.pck"
          tar -C dist/linux -czf dist/minecraft-linux-x86_64.tar.gz .
          (cd dist && sha256sum minecraft-linux-x86_64.tar.gz minecraft-windows-x86_64.zip > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          commit="$(git rev-parse HEAD)"
          godot_version="$("$GODOT_BIN" --headless --version | head -n 1)"
          sdk_version="$(dotnet --version)"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Automated release build.

          - Tag: $tag
          - Commit: $commit
          - Engine: $godot_version
          - .NET SDK: $sdk_version
          - Debug and Release builds: passed with warnings treated as errors.
          - Headless regression suite: passed.
          - Linux x86_64 export: startup smoke test passed.
          - Windows x86_64 export: archive and required files validated; native Windows execution must be verified separately.

          See CHANGELOG.md for release-facing changes and ROADMAP.md for current release readiness.
          EOF
          args=(release create "$tag"
            dist/minecraft-linux-x86_64.tar.gz
            dist/minecraft-windows-x86_64.zip
            dist/SHA256SUMS.txt
            --repo "$GITHUB_REPOSITORY"
            --title "$tag"
            --notes-file "$RUNNER_TEMP/release-notes.md"
            --verify-tag)
          if [[ "$tag" == *-* ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
