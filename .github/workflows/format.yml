name: Formatting

on:
  pull_request:
    paths:
      - "**/*.cs"
      - ".editorconfig"
      - "*.sln"
      - "*.csproj"
      - "global.json"

permissions:
  contents: read

jobs:
  changed-csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify formatting of changed C# files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.cs')
          if (( ${#files[@]} == 0 )); then
            echo "No C# files changed; formatting check is not applicable."
            exit 0
          fi
          printf 'Checking %s changed C# file(s)\n' "${#files[@]}"
          dotnet format whitespace minecraft.sln --verify-no-changes --include "${files[@]}"
