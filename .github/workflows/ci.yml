name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build (0 warnings expected)
        run: dotnet build -c Debug

      - name: Cache Godot mono
        uses: actions/cache@v4
        with:
          path: godot-mono
          key: godot-4.7.2-mono-linux-x86_64

      - name: Download Godot mono
        run: |
          bin=godot-mono/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
          if [ ! -x "$bin" ]; then
            mkdir -p godot-mono
            curl -sSL -o /tmp/godot.zip \
              https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
            unzip -q /tmp/godot.zip -d godot-mono
          fi
          chmod +x "$bin"

      - name: Headless tests
        run: |
          timeout 300 godot-mono/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64 \
            --headless --path . res://tests/TestRunner.tscn
