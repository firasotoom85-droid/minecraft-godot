name: Survival soak

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Soak duration in seconds (3600 = 60 minutes)"
        required: true
        default: "3600"
        type: string

jobs:
  multi-herd-survival:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build (0 warnings expected)
        run: dotnet build -c Debug

      - name: Cache Godot mono
        uses: actions/cache@v4
        with:
          path: godot-mono
          key: godot-4.7.2-mono-linux-x86_64

      - name: Download Godot mono
        run: |
          bin=godot-mono/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
          if [ ! -x "$bin" ]; then
            mkdir -p godot-mono
            curl -sSL -o /tmp/godot.zip \
              https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
            unzip -q /tmp/godot.zip -d godot-mono
          fi
          chmod +x "$bin"

      - name: Run real-scene survival soak
        env:
          SOAK_DURATION: ${{ inputs.duration }}
        run: |
          timeout "$((SOAK_DURATION + 300))" \
            godot-mono/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64 \
            --headless --path . res://tests/SurvivalSoakRunner.tscn -- --duration="$SOAK_DURATION"
